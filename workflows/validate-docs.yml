name: Validate Repository Structure

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing!"
            exit 1
          fi
          echo "/docs folder exists."

      - name: Check required files in /docs
        run: |
          MISSING=0
          
          if [ ! -f "docs/ERD.png" ] && [ ! -f "docs/ERD.pdf" ]; then
            echo "ERROR: ERD.png or ERD.pdf is missing!"
            MISSING=1
          else
            echo "ERD file found."
          fi
          
          if [ ! -f "docs/API_Endpoint_Plan.md" ] && [ ! -f "docs/API_Endpoint_Plan.pdf" ]; then
            echo "ERROR: API Endpoint Plan is missing!"
            MISSING=1
          else
            echo "API Endpoint Plan found."
          fi
          
          if [ ! -f "docs/RaceDay_Database_Script.sql" ]; then
            echo "ERROR: SQL script is missing!"
            MISSING=1
          else
            echo "SQL script found."
          fi
          
          if [ $MISSING -eq 1 ]; then
            exit 1
          fi

      - name: Check README.md exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing!"
            exit 1
          fi
          echo "README.md exists."

      - name: Validate SQL script contains CREATE TABLE
        run: |
          if grep -qi "CREATE TABLE" docs/RaceDay_Database_Script.sql; then
            echo "SQL script contains CREATE TABLE statements."
          else
            echo "ERROR: SQL script missing CREATE TABLE statements!"
            exit 1
          fi

      - name: Validation complete
        run: echo "All validations passed!"
